# =============================================================================
# WSO2 CI PIPELINERUN  -  ABSA Alauda Container Platform
#
# Use from the console:  Pipelines > PipelineRuns > Create, paste this YAML.
# Every run must be a new object, so keep "generateName" (do not set "name").
# Load wso2-absa-pipeline.yaml first (Pipelines > Create).
#
# -----------------------------------------------------------------------------
# VARIABLES TO SET BEFORE YOU RUN  (search this file for  <  to find them)
#
#  REQUIRED
#   repo-url          HTTPS URL of the ABSA GitHub repo
#                       e.g. https://github.com/<org>/<repo>.git
#   revision          Branch to build from; the tag/digest commit is pushed
#                       back to the same branch.  Case-sensitive.
#   context-dir       Folder containing the Dockerfile (build context)
#                       APIM: apim-deployment/apim
#                       MI  : mi-deployment/agency-intg
#   image-name        Image name pushed to JFrog; must match the chart's
#                       repository value.   APIM e.g. wso2am-custom,  MI e.g. wso2mi-custom
#   jfrog-repo        JFrog Docker repo path, no scheme, no tag
#                       e.g. <jfrog-host>/staging-docker
#                       (ask the JFrog admin: repository-path or subdomain format)
#   values-file       Helm values file that holds the image block
#                       APIM: apim-deployment/helm-apim/all-in-one/values.yaml
#                       MI  : mi-deployment/helm-mi/mi/values.yaml
#   storageClassName  A StorageClass name from Storage > StorageClasses
#
#  USUALLY LEAVE AS IS
#   dockerfile        Dockerfile name inside context-dir (default Dockerfile)
#   values-image-path yq path of the image block (default .wso2.deployment.image,
#                       the same for both charts).  Tag AND digest are updated
#                       because the charts deploy by digest.
#   mirror-repo       Optional second target, e.g. <registry-host>/<project>.
#                       Empty = push to JFrog only.
#   scan-severity     Severities that count as findings (HIGH,CRITICAL)
#   scan-exit-code    "1" = fail the run on findings, "0" = report only.
#                       Use "0" for the first run.
#
#  SECRETS (created beforehand in this namespace; see the pipeline file header)
#   registry-auth     Image Registry secret for <jfrog-host>
#   git-auth          Opaque secret: username, password (GitHub token)
#
#  OPTIONAL
#   ca-bundle         ConfigMap custom-ca (key ca.crt) if TLS says
#                       "certificate signed by unknown authority".  Enable the
#                       commented workspace at the bottom.
#   skip-tls-verify   LAB ONLY.  Do not use at ABSA.
#
#  TO BUILD MI INSTEAD OF APIM, change: context-dir, image-name, values-file.
# -----------------------------------------------------------------------------
# Service account: none set, so the namespace "default" ServiceAccount is used.
# =============================================================================
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: wso2-ci-run-
  labels:
    app.kubernetes.io/part-of: wso2-cicd
spec:
  pipelineRef:
    name: wso2-ci-pipeline

  # Lets the non-root steps (uid 1000) write to the shared volume.
  taskRunTemplate:
    podTemplate:
      securityContext:
        fsGroup: 1000

  timeouts:
    pipeline: 1h0m0s

  params:
    # --- Source ---
    - name: repo-url
      value: <https://github.com/ORG/REPO.git>
    - name: revision
      value: <main>

    # --- Build ---
    - name: context-dir
      value: <apim-deployment/apim>
    - name: dockerfile
      value: Dockerfile
    - name: image-name
      value: <wso2am-custom>

    # --- JFrog Artifactory ---
    - name: jfrog-repo
      value: <jfrog-host>/staging-docker
    - name: mirror-repo
      value: ""

    # --- GitOps update ---
    - name: values-file
      value: <apim-deployment/helm-apim/all-in-one/values.yaml>
    - name: values-image-path
      value: .wso2.deployment.image

    # --- Scan ("0" = report only for the first run) ---
    - name: scan-severity
      value: HIGH,CRITICAL
    - name: scan-exit-code
      value: "0"

    # LAB ONLY, do not use at ABSA:
    # - name: skip-tls-verify
    #   value: "true"

  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi
          storageClassName: <storage-class-name>
    - name: registry-auth
      secret:
        secretName: registry-auth
    - name: git-auth
      secret:
        secretName: git-auth
    # Only if the network re-signs TLS (proxy or internal CA): create ConfigMap
    # custom-ca with key ca.crt (PEM), then uncomment these three lines.
    # - name: ca-bundle
    #   configMap:
    #     name: custom-ca
